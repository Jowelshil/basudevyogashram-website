name: Build Android APK

on:
  push:
    branches: [android-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed APK
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk BasudevYogashram.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BasudevYogashram-apk
          path: BasudevYogashram.apk

      - name: Publish as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: বাসুদেব যোগাশ্রম অ্যাপ, সংস্করণ ${{ github.run_number }}
          body: ফোনে ইনস্টল করতে নিচের BasudevYogashram.apk ফাইলটি ডাউনলোড করুন।
          files: BasudevYogashram.apk
          make_latest: true
