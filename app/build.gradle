plugins {
    id 'com.android.application'
}

android {
    namespace 'org.basudevyogashram.hisab'
    compileSdk 34

    defaultConfig {
        applicationId 'org.basudevyogashram.hisab'
        minSdk 21
        targetSdk 34
        // CI passes the run number so every new APK installs over the old one
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName "1." + (System.getenv('VERSION_CODE') ?: '0')
    }

    signingConfigs {
        release {
            storeFile file('../signing/basudev.keystore')
            storePassword 'basudev-yogashram'
            keyAlias 'basudev'
            keyPassword 'basudev-yogashram'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
